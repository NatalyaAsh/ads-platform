syntax = "proto3";

package ad_search.v1;

option go_package = "github.com/NatalyaAsh/ads-platform/proto/gen/go/ad_search/v1";

service AdSearchService {
    // Объявления
    rpc CreateAd(CreateAdRequest) returns (CreateAdResponse);
    rpc GetAd(GetAdRequest) returns (GetAdResponse);
    rpc GetUserAds(GetUserAdsRequest) returns (GetUserAdsResponse);
    rpc UpdateAd(UpdateAdRequest) returns (UpdateAdResponse);
    rpc DeleteAd(DeleteAdRequest) returns (DeleteAdResponse);
    rpc ListAds(ListAdsRequest) returns (ListAdsResponse);
    
    // Категории
    rpc ListCategories(ListCategoriesRequest) returns (ListCategoriesResponse);
    rpc GetCategory(GetCategoryRequest) returns (GetCategoryResponse);
    
    // Медиа (позже добавим)
    // rpc UploadMedia(stream UploadMediaRequest) returns (UploadMediaResponse);
}

// ========== CREATE AD ==========
message CreateAdRequest {
    string title = 1;
    string description = 2;
    double price = 3;
    uint32 user_id = 4;
    uint32 category_id = 5;
}

message CreateAdResponse {
    uint32 id = 1;
    string title = 2;
    string description = 3;
    double price = 4;
    uint32 user_id = 5;
    uint32 category_id = 6;
    string status = 7;
    int32 views = 8;
    string created_at = 9;
    string updated_at = 10;
}

// ========== GET AD ==========
message GetAdRequest {
    uint32 id = 1;
}

message GetAdResponse {
    uint32 id = 1;
    string title = 2;
    string description = 3;
    double price = 4;
    uint32 user_id = 5;
    uint32 category_id = 6;
    string category_name = 7;
    string status = 8;
    int32 views = 9;
    string created_at = 10;
    string updated_at = 11;
}

// ========== GET USER ADS ==========
message GetUserAdsRequest {
    uint32 user_id = 1;
}

message GetUserAdsResponse {
    repeated Ad ads = 1;
}

// ========== UPDATE AD ==========
message UpdateAdRequest {
    uint32 id = 1;
    string title = 2;
    string description = 3;
    double price = 4;
    uint32 category_id = 5;
}

message UpdateAdResponse {
    uint32 id = 1;
    string title = 2;
    string description = 3;
    double price = 4;
    uint32 user_id = 5;
    uint32 category_id = 6;
    string category_name = 7;
    string status = 8;
    int32 views = 9;
    string updated_at = 10;
}

// ========== DELETE AD ==========
message DeleteAdRequest {
    uint32 id = 1;
}

message DeleteAdResponse {
    bool success = 1;
}

// ========== LIST ADS ==========
message ListAdsRequest {
    uint32 category_id = 1;
    uint32 user_id = 2;
    string status = 3;
    double min_price = 4;
    double max_price = 5;
    string sort_by = 6;
    string sort_order = 7;
    int32 limit = 8;
    int32 offset = 9;
}

message ListAdsResponse {
    repeated Ad ads = 1;
    int64 total = 2;
}

// ========== LIST CATEGORIES ==========
message ListCategoriesRequest {}

message ListCategoriesResponse {
    repeated Category categories = 1;
}

// ========== GET CATEGORY ==========
message GetCategoryRequest {
    uint32 id = 1;
}

message GetCategoryResponse {
    uint32 id = 1;
    string name = 2;
    string slug = 3;
}

// ========== COMMON TYPES ==========
message Ad {
    uint32 id = 1;
    string title = 2;
    string description = 3;
    double price = 4;
    uint32 user_id = 5;
    uint32 category_id = 6;
    string category_name = 7;
    string status = 8;
    int32 views = 9;
    string created_at = 10;
    string updated_at = 11;
}

message Category {
    uint32 id = 1;
    string name = 2;
    string slug = 3;
}