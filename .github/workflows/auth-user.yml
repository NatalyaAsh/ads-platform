name: Auth-User CI

on:
  push:
    paths:
      - 'services/auth-user/**'
      - '.github/workflows/auth-user.yml'
  pull_request:
    paths:
      - 'services/auth-user/**'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth-user

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Test
        run: |
          pwd
          go test github.com/NatalyaAsh/ads-platform/services/auth-user/...

      - name: Build
        run: go build -o /dev/null ./...